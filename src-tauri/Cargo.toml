[package]
name = "mobi-pos"
version = "1.7.0"
description = "Mobile Phone Accessories Point of Sale System"
authors = ["Mobi Team"]
edition = "2021"

[lib]
name = "mobi_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# IMPORTANT: keep major.minor in sync with package.json `@tauri-apps/api`
# (Tauri errors at build time on mismatch: "Found version mismatched Tauri
# packages"). Both sides are currently on 2.12.
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
url = "2"
urlencoding = "2"
parking_lot = "0.12"
sha2 = "0.10"
# Phase 4a — Argon2id KDF for device-local PIN storage (trust_core/pin.rs).
# This is the dependency gate AGENTS.md held open ("Argon2id backend pending
# `argon2` dependency approval"); owner-approved 2026-10-02, m=64MiB t=3 p=1.
# `zeroize`/`subtle` are declared EXPLICITLY even though argon2 pulls them in
# transitively: pin.rs uses both directly, and direct use must never depend on
# a transitive version. `zeroize_derive` supplies ZeroizeOnDrop for the
# plaintext-PIN wrappers; argon2's own `zeroize` feature wipes its internals.
argon2 = { version = "0.5", features = ["zeroize"] }
# Same resolved version argon2 uses (cargo unifies them — no second copy).
# Needed explicitly for `getrandom`, which argon2 does not passthrough and
# which `SaltString::generate` needs for a CSPRNG salt.
password-hash = { version = "0.5", features = ["getrandom"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
subtle = "2.6"
# Phase 4d — file-level snapshot encryption (snapshot_crypto.rs). Pure Rust
# (no C toolchain), so mobile builds are unaffected. ChaCha20-Poly1305
# (12-byte random nonce per file, never reused under one key).
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
# Direct OS-randomness for device key material (already in the lockfile via
# password-hash/uuid; declared explicitly because device_identity.rs uses it
# directly — same rule as zeroize/subtle above).
getrandom = "0.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
sqlite-vec = "0.1"
bytemuck = "1.16"
uuid = { version = "1.8", features = ["v4"] }
regex = "1.10"
thiserror = "1.0"
# Smart Import (Slice 1) — Pure Rust Excel reader, character decoders & decompression guards
calamine = "0.37"
encoding_rs = "0.8"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# Local ONNX embedding runtime (384-dim BGE-Small-EN). Optional + off by
# default: `ort` (via fastembed) needs a C++ toolchain + ~100MB runtime and
# would break mobile builds + `cargo test` offline. Default resolver uses
# deterministic 384-dim hashed embeddings (same vec0 schema + Tier
# thresholds); enable with `--features po-embed` for true BGE semantics.
fastembed = { version = "3.9", optional = true }
# Embedded W3C WebDriver server — test surface, enabled ONLY by `e2e`.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.55"

# Phase 2 trusted time: exact sleep-inclusive OS clocks (no std::time::Instant).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# E2E test harness (Phase 1): test-only IPC (`e2e_*`) and the embedded
# WebDriver server, plus the e2e identifier overlay (own data dir for the
# live mobi_pos.db — the filename itself never changes: the patched sql
# plugin confines `load` to exactly mobi_pos.db). Staging/CI builds use
# `--features e2e`; consumer production builds never set it, so no test
# surface ships (Gate 1.3 proves this via binary string search).
# The WebDriver plugin is an OPTIONAL dependency pulled in only here —
# Cargo ignores `debug_assertions`/`feature` inside `[target.'cfg()']`
# tables, which previously linked it into every build.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# True ONNX BGE-Small-EN semantics via fastembed (see note above).
po-embed = ["fastembed"]
