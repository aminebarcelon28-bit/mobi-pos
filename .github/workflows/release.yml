name: Release MobiPOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Signing Environment
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e "
            const fs = require('fs');
            const key = (process.env.RAW_KEY || '').replace(/\r/g, '').trim();
            const pass = (process.env.RAW_PASS || '').replace(/[\r\n]/g, '').trim();
            fs.appendFileSync(process.env.GITHUB_ENV, \`TAURI_SIGNING_PRIVATE_KEY<<EOF\n\${key}\nEOF\nTAURI_SIGNING_PRIVATE_KEY_PASSWORD=\${pass}\n\`);
          "

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MobiPOS ${{ github.ref_name }}'
          releaseBody: 'Voir les notes de version pour les nouveautés de MobiPOS.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
