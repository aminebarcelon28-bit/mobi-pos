name: Five-Target CI Matrix (Desktop + Mobile)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Lint, Types & Business Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: |
          npm run lint
          npx tsc -b

      - name: Run Automated Test Suite (113 Invariants)
        run: npm test

  build-desktop:
    name: Desktop Build (${{ matrix.platform }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS
            os: macos-13
            target: x86_64-apple-darwin
          - platform: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Compile Tauri Binary (Check Only)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

  build-mobile:
    name: Mobile Build Check (${{ matrix.target }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-22.04
          - target: aarch64-apple-ios
            os: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Compile Mobile Target (Cargo Check)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
