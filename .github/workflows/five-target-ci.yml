name: Five-Target CI Matrix (Desktop + Mobile)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Lint, Types & Business Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: |
          npm run lint
          npx tsc -b

      - name: IPC Seam Guard (AGENTS.md §3)
        run: |
          FILES=$(grep -rlE "@tauri-apps/api/(core|event)" src --include="*.ts" --include="*.tsx" | grep -v "^src/platform/" || true)
          if [ -n "$FILES" ]; then
            echo "::error::Direct @tauri-apps/api IPC imports found outside src/platform:"
            echo "$FILES"
            exit 1
          fi
          echo "IPC seam OK: all @tauri-apps/api imports confined to src/platform/"

      - name: Run Automated Test Suite (Business Invariants)
        run: npm test

      - name: Production Build & Prod-Fold Proof (FT-06/B)
        run: |
          npm run build
          node scripts/check-audit-boundary.mjs

  # C-1a: audit-owned money gates run as an ISOLATED job that does NOT depend
  # on quality-gates. Rationale (gate decision): the shared tree is red from
  # other lanes (tsc 53 pre-existing errors, licensing boundary) and fail-fast
  # ordering must never prevent the money gates from running. This job is
  # green today and is the blocking gate for the Zero-Drift Definition of
  # Done. The licensing lane's red stays quarantined in quality-gates.
  audit-money-gates:
    name: Audit Money Gates (Zero-Drift, isolated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Money boundary gate (PD-22/PD-23)
        run: node scripts/check-money-boundary.mjs

      - name: Test J — money entry & display
        run: node scripts/test_money_entry_display.mjs

      - name: Test E — zero-tax consistency
        run: node scripts/test_zero_tax.mjs

      - name: Phase 1c — half-dinar storage regression
        run: node scripts/test_half_dinar_regression.mjs

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # R-2: standalone gate crate — green on clean checkout TODAY,
      # independent of other lanes' breakage (money.rs is self-contained).
      - name: Rust Money suite + shared display fixture (money-gate)
        run: cargo test -p money-gate

      # R-1 (external debt): full-crate money suite, informational until other
      # lanes land their files (E0583 snapshot_prune / E0425 native_hwid_hash).
      # Flips to required (remove continue-on-error) when the tree compiles.
      - name: Rust Money suite, full crate (informational, R-1)
        continue-on-error: true
        run: cargo test -p mobi-pos --lib money::

  build-desktop:
    name: Desktop Build (${{ matrix.platform }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS
            os: macos-13
            target: x86_64-apple-darwin
          - platform: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Compile Tauri Binary (Check Only)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

  build-mobile:
    name: Mobile Build Check (${{ matrix.target }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-22.04
          - target: aarch64-apple-ios
            os: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          NDK_VERSION=$(ls -1 $ANDROID_HOME/ndk 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_VERSION" ]; then
            echo "Installing NDK..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_VERSION="26.1.10909125"
          fi
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "Found Android NDK at: $NDK_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "CC_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV

      - name: Compile Mobile Target (Cargo Check)
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}
