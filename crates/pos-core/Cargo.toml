[package]
name = "pos-core"
version = "1.6.8"
edition = "2021"
description = "Headless domain core, POS math, data contracts, and PosDb trait (Zero Tauri imports)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Engine A spike (ADR-0009, step 1): Turso native sync, optional so all
# existing targets/builds are unaffected until cutover is approved.
turso = { version = "0.7.2", features = ["sync"], optional = true }

[features]
default = []
turso-sync = ["dep:turso"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
